<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__SITE_TITLE__ — Taxa–metabolite knowledge graph explorer</title>
<meta http-equiv="Content-Security-Policy" content="__SITE_CSP__">
<meta name="description" content="Public knowledge graph, associating taxa listed in the PubChem and LOTUS databases with metabolites linked to samples analysed within research projects.">
__SITE_HEAD_CSS__
</head>
<body>
<div id="spinner" role="status" hidden><span class="spin"></span><span data-i18n="spinner"></span></div>

<header id="toolbar">
  <h1>__SITE_TITLE__<span class="baseline">Taxa–metabolite knowledge graph explorer</span></h1>
  <span id="summary" class="summary" data-i18n="summary" data-i18n-args="taxa mols edges"></span>
  <label for="search" class="sr" data-i18n="search"></label>
  <input id="search" type="search" list="search-list" autocomplete="off" data-i18n-ph="searchPh" aria-describedby="search-hint">
  <datalist id="search-list"></datalist>

  <button id="b-relayout" data-i18n="relayout" type="button"></button>
  <button id="b-fit" data-i18n="fit" type="button"></button>
  <button id="b-all" data-i18n="showAll" type="button"></button>
  <button id="x-export" data-i18n="export" type="button"></button>

</header>

<div id="banner" role="status" hidden></div>

<main>
  <div id="cy" role="application" aria-label="Interactive graph of taxa and chemical molecules">
    <button id="b-focus" type="button" hidden title="Back to previous graph" aria-label="Back to previous graph">✕</button>
  </div>
  <aside id="panel">
    <section>
      <h2 data-i18n="details"></h2>
      <div id="detail-body" tabindex="0"><p class="muted" data-i18n="noSelection"></p></div>
    </section>
    <section>
      <h2 data-i18n="filters"></h2>
      <label><input type="checkbox" id="f-taxon" checked> <span data-i18n="taxa"></span></label>
      <label><input type="checkbox" id="f-mol" checked> <span data-i18n="molecules"></span></label>
      <label for="f-deg" data-i18n="minDegree"></label>
      <input type="range" id="f-deg" min="0" value="0" aria-describedby="deg-note">
      <output id="deg-out" for="f-deg">0</output>
      <p class="note" id="deg-note" data-i18n="degNote"></p>
      <label for="depth" data-i18n="depth"></label>
      <select id="depth"><option value="1">1</option><option value="2">2</option></select>
      <button id="b-expand" data-i18n="expand" type="button" disabled></button>
      <h3 data-i18n="selection"></h3>
      <label><input type="checkbox" id="f-hide"> <span data-i18n="hideNonSelected"></span></label>
      <label data-i18n="hideMode"></label>
      <select id="hide-mode">
        <option value="invisible" data-i18n="modeInvisible"></option>
        <option value="greyed" data-i18n="modeGreyed"></option>
      </select>
      <button id="b-remove" data-i18n="removeFromGraph" type="button" disabled></button>
    </section>
    <section>
      <h2 data-i18n="legend"></h2>
      <ul id="legend"></ul>
    </section>
  </aside>
</main>

<footer id="foot">
  <span id="ai-trace"></span>
  <button id="b-about" data-i18n="about" type="button"></button>
</footer>

<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title" data-i18n="dependenciesTitle"></h2>
    <button id="modal-close" data-i18n="close" type="button" aria-label="Close"></button>
    <div id="modal-body"></div>

  </div>
</div>

__SITE_SCRIPTS__
</body>
</html>
